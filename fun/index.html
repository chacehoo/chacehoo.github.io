<script>
const gallerySections = document.querySelectorAll(".gallery-main h2[id]");
const galleryNavLinks = document.querySelectorAll(".gallery-sidebar a");

function setActiveGalleryYear() {
  let currentId = gallerySections[0]?.id || "";
  const offset = 140;

  gallerySections.forEach(section => {
    if (window.scrollY >= section.offsetTop - offset) {
      currentId = section.id;
    }
  });

  galleryNavLinks.forEach(link => {
    link.classList.toggle("active", link.getAttribute("href") === "#" + currentId);
  });
}

galleryNavLinks.forEach(link => {
  link.addEventListener("click", function (event) {
    event.preventDefault();
    const target = document.querySelector(this.getAttribute("href"));

    if (target) {
      const targetPosition = target.getBoundingClientRect().top + window.pageYOffset - 110;
      window.scrollTo({ top: targetPosition, behavior: "auto" });
      history.pushState(null, null, this.getAttribute("href"));
      setActiveGalleryYear();
    }
  });
});

window.addEventListener("scroll", setActiveGalleryYear, { passive: true });
window.addEventListener("load", setActiveGalleryYear);
window.addEventListener("resize", setActiveGalleryYear);
</script>
